# Anchor 定义
pr: &pr {type: select, proxies: [🚀 节点选择, ♻️ 自动选择, 🌐 全部节点, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇲 美国节点, 🧿 其它地区, 🟢 直连]}
health: &health {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}
override: &override {udp: true, skip-cert-verify: false}

# 订阅提供者
proxy-providers:
  WangCai:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://shz.al/~WangCai"
    filter: "^((?!(中国|china|cn)).)*$"
    override:
      <<: *override

  free18:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://cdn.akaere.online/https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/v.txt"
    filter: "^((?!(中国|china|cn)).)*$"
    override:
      <<: *override

# 全局配置
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false

external-ui: ui
external-ui-url: "https://cdn.akaere.online/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: always

# Geodata 配置
geodata-mode: true
geodata-loader: standard
geo-auto-update: false
geox-url:
  geoip: "https://cdn.akaere.online/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://cdn.akaere.online/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://cdn.akaere.online/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

# TUN 模式
tun:
  enable: false
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'

  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query

  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

  proxy-server-nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

# 代理节点
proxies:
  - name: "🟢 直连"
    type: direct
    udp: true
  - name: "DNS_Hijack"
    type: dns

# 策略组
proxy-groups:
  # 主要策略组
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🌐 全部节点, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇲 美国节点, 🧿 其它地区, 🟢 直连]

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "^((?!(直连|DNS)).)*$"

  # 应用分流
  - name: 📹 YouTube
    <<: *pr

  - name: 🍀 Google
    <<: *pr

  - name: 📹 哔哩哔哩
    type: select
    proxies: [🟢 直连, 🚀 节点选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇲 美国节点, 🧿 其它地区, 🌐 全部节点]

  - name: 🎵 Spotify
    <<: *pr

  - name: 📹 巴哈姆特
    type: select
    proxies: [🇨🇳 台湾节点, 🚀 节点选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇲 美国节点, 🧿 其它地区, 🌐 全部节点, 🟢 直连]

  - name: 📲 Telegram
    <<: *pr

  - name: 🎥 NETFLIX
    <<: *pr

  - name: 🐙 GitHub
    <<: *pr

  - name: 🐦 Twitter
    <<: *pr

  - name: 🍎 Apple
    type: select
    proxies: [🟢 直连, 🚀 节点选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇲 美国节点, 🧿 其它地区, 🌐 全部节点]

  - name: 🎯 全球直连
    type: select
    proxies: [🟢 直连, 🚀 节点选择]

  - name: 🐟 漏网之鱼
    <<: *pr

  # 地区分组
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "(?i)港|hk|hongkong|hong kong"

  - name: 🇨🇳 台湾节点
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "(?i)台|tw|taiwan"

  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "(?i)日本|jp|japan"

  - name: 🇸🇬 新加坡节点
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "(?i)新加坡|坡|狮城|sg|singapore"

  - name: 🇺🇲 美国节点
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    lazy: true
    filter: "(?i)美|us|unitedstates|united states"

  - name: 🧿 其它地区
    type: select
    include-all: true
    filter: "(?i)^(?!.*(🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|港|hk|hongkong|台|tw|taiwan|日|jp|japan|新|sg|singapore|美|us|unitedstates|直连|DNS)).*"

  - name: 🌐 全部节点
    type: select
    include-all: true
    filter: "^((?!(直连|DNS)).)*$"

# 规则
rules:
  # DNS 劫持
  - DST-PORT,53,DNS_Hijack

  # 局域网直连
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
  - IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,169.254.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,224.0.0.0/4,🎯 全球直连,no-resolve
  - IP-CIDR,240.0.0.0/4,🎯 全球直连,no-resolve

  # 自定义直连
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - DOMAIN-SUFFIX,gh-proxy.org,🎯 全球直连
  - DOMAIN-SUFFIX,cdn.akaere.online,🎯 全球直连

  # 应用分流
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,apple-cn,🍎 Apple
  - GEOSITE,github,🐙 GitHub
  - GEOSITE,twitter,🐦 Twitter
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,google,🍀 Google
  - GEOSITE,telegram,📲 Telegram
  - GEOSITE,netflix,🎥 NETFLIX
  - GEOSITE,bilibili,📹 哔哩哔哩
  - GEOSITE,biliintl,📹 哔哩哔哩
  - GEOSITE,bahamut,📹 巴哈姆特
  - GEOSITE,spotify,🎵 Spotify
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - GEOSITE,cn,🎯 全球直连

  # IP 分流
  - GEOIP,google,🍀 Google,no-resolve
  - GEOIP,netflix,🎥 NETFLIX,no-resolve
  - GEOIP,telegram,📲 Telegram,no-resolve
  - GEOIP,cn,🎯 全球直连,no-resolve

  # 兜底规则
  - MATCH,🐟 漏网之鱼
